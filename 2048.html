<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2048 · Filiz Yeşili FM</title>
<style>
body{margin:0;background:#faf8ef;font-family:system-ui,sans-serif;text-align:center;color:#776e65;touch-action:none;-webkit-user-select:none;user-select:none}
#g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,400px);margin:10px auto;background:#bbada0;padding:8px;border-radius:8px;box-sizing:border-box}
.t{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(18px,7vw,34px);background:#cdc1b4}
button{font:inherit;background:#8f7a66;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
</style></head><body>
<h2 style="margin:10px">2048</h2><div>Puan: <b id="sc">0</b> <button id="nw">Yeni Oyun</button></div><div id="g"></div><div id="m" style="font-weight:700"></div>
<div style="font-size:12px;padding:6px">Ok tuşları veya parmakla kaydır. Aynı sayıları birleştir.</div>
<script>
const $=id=>document.getElementById(id);let b,sc;
const C={2:'#eee4da',4:'#ede0c8',8:'#f2b179',16:'#f59563',32:'#f67c5f',64:'#f65e3b',128:'#edcf72',256:'#edcc61',512:'#edc850',1024:'#edc53f',2048:'#edc22e'};
function add(){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function nw(){b=Array(16).fill(0);sc=0;$('m').textContent='';add();add();draw()}
function draw(){$('g').innerHTML=b.map(v=>`<div class="t" style="background:${v?C[v]||'#3c3a32':''};color:${v>4?'#fff':'#776e65'}">${v||''}</div>`).join('');$('sc').textContent=sc}
function line(a){const r=a.filter(x=>x),o=[];for(let i=0;i<r.length;i++){if(r[i]===r[i+1]){o.push(r[i]*2);sc+=r[i]*2;i++}else o.push(r[i])}while(o.length<4)o.push(0);return o}
function over(){return b.every((v,i)=>v&&(i%4>2||v!==b[i+1])&&(i>11||v!==b[i+4]))}
function mv(d){const o=b.join();
 for(let k=0;k<4;k++){const idx=[0,1,2,3].map(j=>d===0?k*4+j:d===1?k*4+3-j:d===2?j*4+k:(3-j)*4+k);const l=line(idx.map(i=>b[i]));idx.forEach((i,j)=>b[i]=l[j])}
 if(b.join()!==o){add();draw();if(b.includes(2048))$('m').textContent='🎉 2048!';else if(over())$('m').textContent='Oyun bitti'}}
document.addEventListener('keydown',e=>{const d={ArrowLeft:0,ArrowRight:1,ArrowUp:2,ArrowDown:3}[e.key];if(d!==undefined){e.preventDefault();mv(d)}});
let sx,sy;document.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY});
document.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;
 mv(Math.abs(dx)>Math.abs(dy)?(dx<0?0:1):(dy<0?2:3))});
$('nw').onclick=nw;nw();
</script></body></html>
