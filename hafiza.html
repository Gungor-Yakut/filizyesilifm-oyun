<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hafıza · Filiz Yeşili FM</title>
<style>
body{margin:0;background:#1b1340;color:#fff;font-family:system-ui,sans-serif;text-align:center;-webkit-user-select:none;user-select:none}
#g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:min(92vw,400px);margin:10px auto}
.c{aspect-ratio:1;border-radius:10px;background:#4b3a9e;display:flex;align-items:center;justify-content:center;font-size:clamp(28px,10vw,48px);cursor:pointer}
.c.o{background:#fff}.c.m{background:#2e9e5b}
button{font:inherit;background:#6d4bd1;color:#fff;border:0;border-radius:6px;padding:7px 14px;cursor:pointer}
</style></head><body>
<div style="padding:10px">Hamle: <b id="mv">0</b> <button id="nw">Yeni Oyun</button></div><div id="g"></div><div id="m" style="font-weight:700"></div>
<script>
const $=id=>document.getElementById(id);let cards,open,moves,lock;
function nw(){const e=['🎵','🎤','🎧','📻','🎸','🥁','🎹','🎺'];cards=[...e,...e].map(v=>({v,o:false,m:false}));
 for(let i=15;i>0;i--){const j=Math.random()*(i+1)|0;[cards[i],cards[j]]=[cards[j],cards[i]]}
 open=[];moves=0;lock=false;$('m').textContent='';draw()}
function draw(){$('g').innerHTML=cards.map((c,i)=>`<div class="c ${c.m?'m':c.o?'o':''}" data-i="${i}">${c.o||c.m?c.v:''}</div>`).join('');$('mv').textContent=moves}
$('g').addEventListener('click',e=>{const el=e.target.closest('[data-i]');if(!el||lock)return;const i=+el.dataset.i,c=cards[i];if(c.o||c.m)return;
 c.o=true;open.push(i);draw();
 if(open.length===2){moves++;lock=true;const[a,b]=open;
  setTimeout(()=>{if(cards[a].v===cards[b].v){cards[a].m=cards[b].m=true}cards[a].o=cards[b].o=false;open=[];lock=false;draw();
   if(cards.every(c=>c.m))$('m').textContent='🎉 Tebrikler! '+moves+' hamlede bitirdin'},700)}});
$('nw').onclick=nw;nw();
</script></body></html>
